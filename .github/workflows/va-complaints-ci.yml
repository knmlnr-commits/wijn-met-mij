name: va-complaints CI

on:
  pull_request:
    paths:
      - "va-complaints/**"
      - ".github/workflows/va-complaints-ci.yml"
  push:
    branches: [main]
    paths:
      - "va-complaints/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations, RLS per role and workflow functions are tested against this throwaway server.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: va-complaints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: va-complaints/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (rules engine, house style, validation, migrations and RLS per role)
        run: npm run test
      - name: Build
        run: npm run build
