name: va-complaints CI

on:
  pull_request:
    paths:
      - "va-complaints/**"
      - ".github/workflows/va-complaints-ci.yml"
  push:
    branches: [main]
    paths:
      - "va-complaints/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: va-complaints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: va-complaints/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests, rules engine and house style
        run: npm run test
      - name: Build
        run: npm run build
