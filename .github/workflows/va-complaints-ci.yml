name: va-complaints CI

on:
  pull_request:
    paths:
      - "va-complaints/**"
      - ".github/workflows/va-complaints-ci.yml"
  push:
    branches: [main]
    paths:
      - "va-complaints/**"
      - ".github/workflows/va-complaints-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations, RLS per role and workflow functions are tested against this throwaway server.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: va-complaints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: va-complaints/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (rules engine, house style, validation, migrations and RLS per role)
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    # Main flow in a browser against a local Supabase: login, register, acknowledge, final
    # response, report export.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: va-complaints
    env:
      DEMO_USER_PASSWORD: ci-only-demo-password-1
      NEXT_PUBLIC_DEV_LOGIN: "true"
      E2E_FULL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: va-complaints/package-lock.json
      - run: npm ci
      - name: Start local Supabase (applies migrations and seed.sql)
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector
      - name: Export Supabase connection details
        run: |
          npx supabase status -o env > supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' supabase.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$(grep '^DB_URL=' supabase.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          rm supabase.env
      - name: Seed demo users and synthetic complaints
        run: npm run seed:demo
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: va-complaints/test-results
          retention-days: 7
